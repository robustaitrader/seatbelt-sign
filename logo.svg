<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Seatbelt Sign</title>
  <defs>
    <linearGradient id="lit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc35c"/>
      <stop offset="1" stop-color="#f08a34"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
  </defs>
  <!-- the dark cabin ceiling; Telegram shows it as a circle -->
  <rect width="1024" height="1024" fill="#151514"/>
  <!-- the lit sign, with its glow -->
  <rect x="212" y="212" width="600" height="600" rx="118" fill="#f39a3c" opacity="0.55" filter="url(#glow)"/>
  <rect x="212" y="212" width="600" height="600" rx="118" fill="url(#lit)"/>
  <rect x="236" y="236" width="552" height="552" rx="98" fill="none" stroke="#151514" stroke-opacity="0.18" stroke-width="6"/>
  <!-- the seat: its back and cushion, in shadow behind the figure -->
  <g fill="#151514" opacity="0.24">
    <rect x="384" y="262" width="256" height="400" rx="76"/>
    <rect x="352" y="604" width="320" height="76" rx="30"/>
  </g>
  <!-- a seated figure, from the front -->
  <g fill="#151514">
    <circle cx="512" cy="330" r="54"/>
    <rect x="444" y="400" width="136" height="196" rx="44"/>
    <rect x="394" y="420" width="40" height="160" rx="20"/>
    <rect x="590" y="420" width="40" height="160" rx="20"/>
    <rect x="452" y="640" width="54" height="128" rx="24"/>
    <rect x="518" y="640" width="54" height="128" rx="24"/>
  </g>
  <!-- the belt across the lap, from one side of the seat to the other, with its buckle -->
  <rect x="362" y="560" width="300" height="66" rx="16" fill="url(#lit)"/>
  <rect x="372" y="570" width="280" height="46" rx="12" fill="#151514"/>
  <rect x="482" y="560" width="60" height="66" rx="12" fill="url(#lit)"/>
  <rect x="494" y="572" width="36" height="42" rx="8" fill="#151514"/>
</svg>
